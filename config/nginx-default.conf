server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # MIME types corretos para módulos ES (import/export precisam de JS MIME)
    types {
        text/html               html htm;
        text/css                css;
        application/javascript  js mjs;
        application/json        json;
        image/png               png;
        image/svg+xml           svg;
        image/x-icon            ico;
    }

    # Páginas do app
    location = /carteira.html {
        try_files /carteira.html =404;
    }

    # Sem cache para desenvolvimento: sempre pega a versão nova dos arquivos
    location ~* \.(js|css|html)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
