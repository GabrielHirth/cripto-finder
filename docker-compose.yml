services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017" # opcional: ver os dados no MongoDB Compass
    volumes:
      - dados-mongo:/data/db # os dados continuam ao reiniciar

  restheart:
    image: softinstigate/restheart:8
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      RHO: '/mclient/connection-string->"mongodb://mongodb:27017";/http-listener/host->"0.0.0.0"'
    ports:
      - "8080:8080"

  # Ponto extra (+1,0): o frontend também sobe no mesmo docker compose up -d
  frontend:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - restheart
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro

volumes:
  dados-mongo:
